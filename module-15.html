x;background:#e9e9ed;color:#555;text-decoration:none;font-size:11px;font-weight:700}.card{margin:15px 0;padding:27px;border:1px solid #fff;border-radius:25px;background:var(--card);box-shadow:0 18px 55px #00000009}.card h2{margin:0 0 13px;font-size:26px;letter-spacing:-.05em}.card h3{font-size:18px;letter-spacing:-.03em;margin-bottom:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini{padding:18px;border-radius:18px;background:#f1f1f3}.mini p{margin-bottom:0}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.flow div{padding:15px 10px;border-radius:16px;background:#f0f0f2;text-align:center;font-size:11px;font-weight:700}.flow b{display:block;color:var(--blue);font-size:17px;margin-bottom:5px}pre{background:#1c1c1e;color:#f5f5f7;padding:18px;border-radius:17px;overflow:auto;line-height:1.65}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.note{padding:16px 18px;background:#eef5ff;border-left:3px solid var(--blue);border-radius:0 15px 15px 0;margin-top:15px}.warn{background:#fff4e5;border-left-color:var(--orange)}.danger{background:#fff0f0;border-left-color:var(--red)}.checks{display:grid;gap:7px}.check{padding:13px;border-radius:14px;background:#ffffffa8}.check input{margin-right:9px;accent-color:var(--blue)}.score{font-size:13px;color:#666;margin-top:12px}.sources a{color:var(--blue)}.footer{text-align:center;color:#999;padding:55px 0 70px;font-size:11px}@media(max-width:650px){.hero{padding-top:65px}.grid{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.card{padding:21px}.hero p.lead{font-size:16px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}<\/style></head><body><nav class="nav"><a class="brand" href="index.html">FullStack<span>Bible</span></a><a class="back" href="roadmap.html">Roadmap</a></nav><header class="wrap hero"><div class="eyebrow">MODULE 15 · PRODUCT ENGINEERING</div><h1>Build the workflows that make a <span>business run.</span></h1><p class="lead">Payments are a specialization, but they teach a broader engineering discipline: external systems are asynchronous, security-sensitive, stateful, and capable of failing at exactly the wrong moment.</p><div class="meta"><span class="pill">Zero → Advanced</span><span class="pill">Billing architecture</span><span class="pill">Security</span><span class="pill">Production lab</span><span class="pill">18+ checks</span></div></header><main class="wrap"><nav class="toc"><a href="#model">Mental model</a><a href="#checkout">Checkout</a><a href="#webhooks">Webhooks</a><a href="#subscriptions">Subscriptions</a><a href="#state">State machine</a><a href="#security">Security</a><a href="#recovery">Recovery</a><a href="#lab">Lab</a><a href="#capstone">Capstone</a></nav><section class="card" id="model"><h2>1. The billing mental model</h2><p>Do not begin with a button that says <em>Pay</em>. Begin with the business transaction. Your application owns customers, orders, products, prices, entitlements and internal state. A payment provider owns payment instruments, payment attempts and provider-side transaction state. Your integration is the boundary between them.</p><div class="flow"><div><b>01</b>Business intent</div><div><b>02</b>Payment attempt</div><div><b>03</b>Provider event</div><div><b>04</b>Entitlement</div></div><div class="grid"><div class="mini"><h3>Your system</h3><p>Order ID, user ID, plan, amount, currency, entitlement and internal billing state.</p></div><div class="mini"><h3>Provider</h3><p>Customer, payment object, invoice, subscription, charge/payment attempt and webhook events.</p></div></div><div class="note"><strong>Core principle:</strong> never make access to a paid feature depend solely on what the browser says happened.</div></section><section class="card"><h2>2. Payment lifecycle</h2><p>A robust payment flow separates <strong>intent</strong> from <strong>result</strong>. A user can click once while the network retries, authentication can be required, a payment can remain processing, or the provider can notify your backend after the browser has disappeared.</p><pre><code>POST /api/checkout
       ↓
create internal order
       ↓
create provider payment object
       ↓
client completes payment/authentication
       ↓
provider processes payment
       ↓
verified webhook
       ↓
transaction + entitlement update</code></pre><p>Stripe's PaymentIntent model is an example of this lifecycle: a PaymentIntent represents a payment session and can transition through multiple statuses before success or cancellation. citeturn1search1</p></section><section class="card" id="checkout"><h2>3. Checkout integration</h2><p>There are several integration shapes: provider-hosted checkout, embedded provider components, or a more customized payment UI. The engineering question is not simply “which looks better?” It is how much payment surface you want your application to own, what compliance obligations apply, and which payment methods you need.</p><div class="grid"><div class="mini"><h3>Hosted checkout</h3><p>Provider handles more of the sensitive payment interaction. Your application receives the resulting business event.</p></div><div class="mini"><h3>Embedded components</h3><p>More control over the experience, but your payment page and surrounding scripts must be designed carefully.</p></div><div class="mini"><h3>Custom collection</h3><p>Maximum control and substantially more responsibility. Only choose it when there is a real product requirement.</p></div><div class="mini"><h3>Redirect is not proof</h3><p>A success page can improve UX, but it should not be the sole authority for granting durable access.</p></div></div><div class="note warn"><strong>Compliance boundary:</strong> PCI DSS applies to environments that store, process or transmit payment account data. Outsourcing payment functions can reduce scope, but does not automatically eliminate every merchant responsibility. citeturn0search7turn0search0</div></section><section class="card"><h2>4. Idempotency: the duplicate-payment problem</h2><p>Networks fail in ambiguous ways. Your server may send a request, the provider may process it, and the connection may fail before your server receives the response. Retrying without an idempotency strategy can create duplicate operations.</p><pre><code>const key = `checkout:${orderId}`;

// Conceptual server request
provider.createPayment({
  amount,
  currency,
  orderId
}, {
  idempotencyKey: key
});</code></pre><p>Stripe documents idempotency keys specifically for safely retrying requests without accidentally performing the same operation twice. citeturn1search3</p><p>Your own database should also enforce uniqueness where appropriate. Idempotency is not merely an API option; it is a business invariant.</p></section><section class="card" id="webhooks"><h2>5. Webhooks are part of your backend</h2><p>A webhook is an incoming server-to-server event. Treat it as untrusted input until its signature is verified and its payload is validated. Then make processing safe to repeat.</p><pre><code>POST /api/webhooks/provider
  │
  ├─ read raw request body
  ├─ verify signature
  ├─ validate event structure
  ├─ check event_id uniqueness
  ├─ persist receipt
  ├─ apply state transition
  └─ return 2xx</code></pre><p>Stripe describes webhooks as HTTP endpoints used to receive events such as successful payments and disputes, and provides tooling for local testing. citeturn1search11</p><div class="note danger"><strong>Never:</strong> trust a client-provided “payment succeeded” flag, skip signature verification, or perform a non-idempotent side effect every time the same event is delivered.</div></section><section class="card"><h2>6. Event deduplication and ordering</h2><p>Store provider event IDs in a durable table with a unique constraint. If an event arrives twice, the second delivery should become a no-op. Do not assume events always arrive in the business order you imagined; fetch current provider state when necessary and design transitions that tolerate delayed notifications.</p><pre><code>payment_events
-----------------------------
id              primary key
provider_id     unique
event_type
received_at
processed_at
status
payload_hash</code></pre><p>A practical webhook processor is therefore closer to a small message-consumer system than to a normal controller.</p></section><section class="card" id="subscriptions"><h2>7. Subscription engineering</h2><p>Subscriptions turn one payment into a recurring state machine. Model the commercial product separately from the provider's identifiers. Typical models include flat-rate, per-seat, tiered and usage-based pricing.</p><div class="grid"><div class="mini"><h3>Plan</h3><p>Commercial definition: Starter, Pro, Team, etc.</p></div><div class="mini"><h3>Price</h3><p>Currency, amount, interval, tax and billing rules.</p></div><div class="mini"><h3>Subscription</h3><p>Customer's current commercial relationship with a plan.</p></div><div class="mini"><h3>Entitlement</h3><p>What the user is actually allowed to access.</p></div></div><p>Keep these concepts separate. A subscription record should not become your entire authorization system.</p></section><section class="card" id="state"><h2>8. Billing as a state machine</h2><p>A boolean such as <code>paid=true</code> cannot represent a real billing lifecycle. Use explicit states and transition rules. Exact states depend on the product and provider, but a conceptual model can look like:</p><pre><code>trialing → active → past_due → active
     │          │          │
     ↓          ↓          ↓
 canceled    paused    canceled

refunds and disputes are separate business events</code></pre><p>Define which transitions grant, preserve, restrict or revoke entitlements. Write these rules down before implementing UI.</p></section><section class="card"><h2>9. Invoices, renewals and proration</h2><p>An invoice represents an amount owed and can be created for one-off charges or generated from a subscription. Changes such as upgrades or downgrades can create proration adjustments. citeturn1search0</p><p>Do not calculate provider-specific billing behavior from assumptions. Read the provider's current documentation and test the exact scenarios your product supports.</p><div class="grid"><div class="mini"><h3>Upgrade</h3><p>Decide whether new access starts immediately and how unused time is accounted for.</p></div><div class="mini"><h3>Downgrade</h3><p>Decide whether limits change immediately or at the next billing boundary.</p></div><div class="mini"><h3>Cancellation</h3><p>Distinguish cancellation requested from access actually ending.</p></div><div class="mini"><h3>Refund</h3><p>Define the relationship between money returned and entitlement.</p></div></div></section><section class="card"><h2>10. Failed payments and recovery</h2><p>Payment failure is not one event. A card can be declined, authentication can be required, a payment method can expire, or a recurring charge can fail. Build a recovery workflow instead of treating failure as a generic 500 error.</p><div class="flow"><div><b>01</b>Detect</div><div><b>02</b>Record</div><div><b>03</b>Notify</div><div><b>04</b>Recover</div></div><p>For India-issued cards, payment and mandate behavior can have additional regulatory and issuer constraints. Stripe's current India recurring-payments documentation describes mandate creation, customer authentication and specific retry behavior for India-issued cards. citeturn1search10</p></section><section class="card" id="security"><h2>11. Payment security</h2><p>Security starts with data minimization. Do not collect or store sensitive payment data simply because it is technically possible. Keep secrets server-side, use TLS, validate webhook signatures, restrict administrative billing actions, audit refunds and protect logs from sensitive data leakage.</p><ul><li>Never expose secret API keys to browser code.</li><li>Use separate test and live credentials.</li><li>Do not log card numbers, security codes or payment secrets.</li><li>Authorize refunds, plan changes and manual credits.</li><li>Use database constraints for financial invariants.</li><li>Audit who changed billing state and why.</li><li>Keep payment-provider identifiers linked to internal IDs.</li></ul><p>PCI SSC identifies PCI DSS as a baseline of technical and operational requirements for protecting payment account data. citeturn0search10</p></section><section class="card"><h2>12. Entitlements and authorization</h2><p>Payment success and product access are related but distinct. Build an entitlement layer:</p><pre><code>payment state
     ↓
commercial subscription
     ↓
entitlement policy
     ↓
authorization check
     ↓
feature access</code></pre><p>For example, “Pro subscription active” might grant access to a feature, but the application should still enforce that rule on the server. Never rely on hiding a button as authorization.</p></section><section class="card"><h2>13. Reconciliation</h2><p>Production billing needs a way to discover mismatches. Reconciliation compares your internal records with provider records and identifies missing events, unexpected states, duplicate references or amounts that need investigation.</p><div class="grid"><div class="mini"><h3>Daily checks</h3><p>Payments, refunds, subscriptions and invoices changed during the period.</p></div><div class="mini"><h3>Exception queue</h3><p>Every mismatch becomes an explicit investigation item.</p></div><div class="mini"><h3>Repair safely</h3><p>Prefer replaying verified provider state or controlled administrative actions.</p></div><div class="mini"><h3>Audit trail</h3><p>Record who performed a manual correction and what changed.</p></div></div></section><section class="card"><h2>14. Testing billing systems</h2><p>Payment code requires more than a happy-path test. Build a matrix around state transitions and failures.</p><pre><code>✓ checkout success
✓ authentication required
✓ payment declined
✓ processing delayed
✓ duplicate webhook
✓ out-of-order webhook
✓ invalid signature
✓ refund
✓ cancellation
✓ renewal failure
✓ provider timeout
✓ database transaction failure</code></pre><p>Use provider test environments and deterministic fixtures. Never test destructive billing scenarios against live customer data.</p></section><section class="card"><h2>15. Deliberate failure drills</h2><div class="grid"><div class="mini"><h3>Drill A — lost response</h3><p>Simulate a provider request timing out after the provider accepted it. Design the retry and idempotency behavior.</p></div><div class="mini"><h3>Drill B — duplicate event</h3><p>Deliver the same successful-payment webhook twice. Prove that the second delivery creates no duplicate entitlement.</p></div><div class="mini"><h3>Drill C — invalid signature</h3><p>Send a modified payload with an invalid signature. Prove that no billing state changes.</p></div><div class="mini"><h3>Drill D — delayed renewal</h3><p>Simulate a renewal event arriving after the user opens the application. Define the temporary access state and reconciliation behavior.</p></div></div></section><section class="card" id="lab"><h2>16. Hands-on lab — billing state engine</h2><p>Build a provider-independent billing simulator before integrating a real provider. This forces you to understand the business rules rather than hiding them inside SDK calls.</p><pre><code>type BillingState =
  | 'trialing'
  | 'active'
  | 'past_due'
  | 'paused'
  | 'canceled';

type BillingEvent =
  | 'payment_succeeded'
  | 'payment_failed'
  | 'pause'
  | 'resume'
  | 'cancel'
  | 'refund';

function transition(
  state: BillingState,
  event: BillingEvent
): BillingState {
  // define and test explicit transitions
}</code></pre><p>Requirements: reject illegal transitions, make event processing repeatable, persist an event ID, record timestamps, expose the resulting entitlement and write tests for every transition.</p></section><section class="card" id="capstone"><h2>17. Capstone — production SaaS billing sandbox</h2><p>Build a complete billing slice for FullStack Bible or another learning product. It should support plans, checkout, subscriptions, verified webhooks, idempotency, entitlements, cancellation, refunds and reconciliation.</p><h3>Required architecture</h3><pre><code>Next.js UI
   ↓
Billing API
   ├── Orders
   ├── Customers
   ├── Subscriptions
   ├── Entitlements
   └── Webhook consumer
          ↓
     Payment provider
          ↓
   Event / reconciliation store
          ↓
      Audit + alerts</code></pre><h3>Definition of done</h3><ul><li>No raw card data stored in the application database.</li><li>Every payment operation has an internal correlation ID.</li><li>Provider requests use an idempotency strategy where applicable.</li><li>Webhook signatures are verified.</li><li>Webhook events are deduplicated.</li><li>Billing state transitions are explicit and tested.</li><li>Entitlements are enforced server-side.</li><li>Refund and cancellation behavior is documented.</li><li>Failed payments have a recovery path.</li><li>Reconciliation can find mismatches.</li><li>Administrative billing operations are authorized and audited.</li><li>Test-mode failure scenarios are demonstrated.</li></ul></section><section class="card"><h2>18. Knowledge check</h2><ol><li>Why is a payment intent different from an entitlement?</li><li>Why should a browser success page not be your payment authority?</li><li>What problem does an idempotency key solve?</li><li>Why must webhook payloads be signature-verified?</li><li>Why should webhook event IDs be unique in your database?</li><li>What can happen when webhooks arrive out of order?</li><li>Why should billing be modeled as explicit state transitions?</li><li>What is proration?</li><li>How should a subscription cancellation differ from immediate access revocation?</li><li>Why separate products, prices, subscriptions and entitlements?</li><li>What is the purpose of reconciliation?</li><li>Which payment data should your application avoid storing?</li><li>Why are provider secret keys server-side secrets?</li><li>What should happen when a webhook has an invalid signature?</li><li>How should duplicate successful-payment events affect entitlements?</li><li>Why do payment failures need a recovery workflow?</li><li>Why should financial corrections have an audit trail?</li><li>How would you test a provider timeout after an apparently successful request?</li><li>Why should test-mode payment scenarios be automated?</li><li>What remains your application's security boundary even when a payment provider handles card collection?</li></ol></section><section class="card"><h2>19. Completion checklist</h2><div class="checks" id="checks"></div><div class="score" id="score"></div></section><section class="card sources"><h2>Authoritative references</h2><ul><li><a href="https://docs.stripe.com/payments/payment-intents">Stripe — Payment Intents</a></li><li><a href="https://docs.stripe.com/webhooks/handling-payment-events">Stripe — Handle payment events with webhooks</a></li><li><a href="https://docs.stripe.com/api/idempotent_requests">Stripe — Idempotent requests</a></li><li><a href="https://docs.stripe.com/api/invoices">Stripe — Invoices</a></li><li><a href="https://docs.stripe.com/india-recurring-payments">Stripe — India recurring payments</a></li><li><a href="https://www.pcisecuritystandards.org/standards/pci-dss/">PCI Security Standards Council — PCI DSS</a></li><li><a href="https://www.pcisecuritystandards.org/standards/secure-software/">PCI SSC — Secure Software</a></li></ul></section></main><footer class="wrap footer">FullStack Bible · Module 15 · Product Engineering & Billing</footer><script>const key='fullstack-module-15-progress';const labels=['Explain the boundary between application and payment provider','Model the payment lifecycle','Compare checkout integration models','Use idempotency for retryable payment operations','Design a durable webhook receiver','Verify webhook signatures','Deduplicate provider events','Handle out-of-order events','Model products, prices and subscriptions','Model entitlements separately from billing','Design explicit billing state transitions','Explain invoices and proration','Handle failed payments and recovery','Design refund and cancellation behavior','Build a reconciliation strategy','Apply payment security and data minimization','Complete the billing state-engine lab','Complete the production SaaS billing sandbox'];const old=JSON.parse(localStorage.getItem(key)||'[]');const checks=document.getElementById('checks');checks.innerHTML=labels.map((x,i)=>`<label class="check"><input type="checkbox" ${old[i]?'checked':''}>${x}</label>`).join('');const inputs=[...checks.querySelectorAll('input')];function render(){const a=inputs.map(x=>x.checked);localStorage.setItem(key,JSON.stringify(a));const n=a.filter(Boolean).length;document.getElementById('score').textContent=`${n} / ${labels.length} complete · ${Math.round(n/labels.length*100)}%`;};inputs.forEach(x=>x.addEventListener('change',render));render();<\/script></body></html>
