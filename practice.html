<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>Practice — FullStack Bible</title><script src="progress.js"></script><style>:root{--bg:#f5f5f7;--ink:#111113;--muted:#6e6e73;--blue:#007aff;--green:#34c759;--purple:#5856d6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(60% 35% at 90% 0,#5856d622,transparent 70%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:var(--ink)}.wrap{width:min(920px,calc(100% - 28px));margin:auto}.nav{position:sticky;top:10px;z-index:5;margin-top:10px;padding:9px 10px 9px 17px;border:1px solid #fff;border-radius:20px;background:#ffffffb0;backdrop-filter:blur(25px);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.06em;text-decoration:none;color:inherit}.brand span{color:var(--blue)}.back{padding:10px 14px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-size:12px;font-weight:700}.hero{padding:82px 0 30px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#999;font-weight:800}.hero h1{font-size:clamp(48px,8vw,80px);line-height:.94;letter-spacing:-.085em;margin:14px 0}.hero p{color:var(--muted);font-size:17px;line-height:1.65;max-width:720px}.context{display:flex;gap:8px;margin:15px 0}.pill{padding:7px 10px;border-radius:999px;background:#eee9ff;color:var(--purple);font-size:10px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:22px;border:1px solid #fff;border-radius:23px;background:#ffffffb8;box-shadow:0 15px 48px #00000008}.card h2{font-size:21px;letter-spacing:-.045em;margin:0 0 9px}.card p{font-size:14px;line-height:1.65;color:#5d5d63;margin:0}.difficulty{display:inline-block;margin-bottom:13px;padding:5px 8px;border-radius:999px;background:#eeeef1;color:#777;font-size:9px;font-weight:800;letter-spacing:.08em}.card button{margin-top:16px;border:0;border-radius:999px;padding:10px 13px;background:#111;color:#fff;font-size:11px;font-weight:700;cursor:pointer}.card .complete{margin-left:5px;background:#e9e9ed;color:#666}.card .complete.done{background:var(--green);color:#fff}.challenge{display:none;margin-top:15px;padding:14px;border-radius:15px;background:#f0f0f3;color:#444;font-size:13px;line-height:1.65}.challenge.open{display:block}.footer{text-align:center;color:#999;padding:55px 0 70px;font-size:11px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card .complete{margin-left:0;margin-top:8px;display:block}}</style></head><body><nav class="nav wrap"><a class="brand" href="index.html">FullStack<span>Bible</span></a><a class="back" href="learn.html">Your journey</a></nav><header class="wrap hero"><div class="eyebrow">LEARNING HUB · PRACTICE</div><div class="context" id="context"></div><h1 id="title">Make your brain do the work.</h1><p id="intro">Practice should force recall, reasoning and debugging. Try first, then verify with the module and primary documentation.</p></header><main class="wrap grid" id="grid"></main><footer class="wrap footer">Practice → explain → verify</footer><script>const all=[['01','FOUNDATION','Web request detective','Trace a URL from browser input to rendered page.','Use DevTools Network to identify the document, stylesheet, script and image. Record method, status and response type.'],['02','HTML · CSS','Accessible interface','Build a semantic card with heading, image, link and form control.','Test keyboard order, focus, accessible names, image alternatives and contrast.'],['03','JAVASCRIPT','Async state debugger','A dashboard works until refresh or a slow request occurs. Find the state boundary.','Trace idle → loading → success/error and persistence. Verify with DevTools.'],['04','GIT · DEBUGGING','Recover a broken change','A recent commit introduced a regression. Recover without random edits.','Use status, diff, log and bisect when useful. Reproduce, isolate, fix and regression-test.'],['05','TYPESCRIPT','Impossible-state model','Model idle, loading, success and failure safely.','Use a discriminated union and demonstrate compiler narrowing.'],['06','REACT','State ownership drill','A search input and list disagree about the current query.','Lift shared state to the nearest common owner and derive filtered results.'],['07','NEXT.JS','Server/client boundary','A page needs database data and an interactive progress button.','Keep secrets/data access server-side; isolate browser interaction in a Client Component.'],['08','SQL','Relationship query','Return enrolled courses with lesson counts.','Model learner → enrollment → course → lesson and handle empty results.'],['09','BACKEND','Object authorization drill','A user changes a resource ID in the URL.','Verify identity and authorization for that exact resource on the server.'],['10','PRODUCTION','Failure-path matrix','Design behavior for timeout, 500, validation failure and lost responses.','Define UI state, retry policy, server behavior and idempotency for each.'],['11','AI','Prompt-injection boundary','Retrieved content instructs an AI system to reveal private data.','Treat retrieved text as untrusted; keep authorization and secrets outside model control.'],['12','PRODUCT','Vertical slice','Turn one product idea into a small releasable workflow.','Write outcome, acceptance criteria, data, server operation, UI states and release test.'],['13','SYSTEM DESIGN','Capacity & failure drill','Design a Learning Hub for a sudden 10× traffic spike.','Estimate RPS, identify bottlenecks, add caching/queues, define timeouts and failure isolation.'],['14','TOOLING','Monorepo change drill','Add a shared package without creating a dependency cycle.','Map package boundaries, workspace dependencies and CI quality gates. Explain cache correctness.'],['15','BILLING','Webhook reliability drill','A payment webhook arrives twice and one delivery is delayed.','Design signature verification, idempotency, durable event state and reconciliation.'],['16','DATA · SEARCH','Search synchronization drill','A lesson changes but search still shows the old title.','Design an outbox/indexing flow, retry policy, replay and full rebuild path.'],['17','PROFESSIONAL','Incident response simulation','A release causes elevated errors for a subset of users.','Define detection, severity, incident roles, mitigation, rollback, communication, timeline and postmortem actions.']];const q=new URLSearchParams(location.search).get('stage');const selected=q?all.filter(x=>x[0]===q):all;const context=document.getElementById('context');if(q&&selected.length){context.innerHTML='<span class="pill">MODULE '+q+'</span><span class="pill">Focused practice</span>';document.getElementById('title').textContent='Practice Module '+q+' with intent.';document.getElementById('intro').textContent='Attempt the challenge before opening the task. Then verify your reasoning against the module and authoritative documentation.'}function render(){document.getElementById('grid').innerHTML=selected.map(x=>{const done=FSBProgress.stage(x[0]).practice;return `<article class="card"><span class="difficulty">${x[1]}</span><h2>${x[2]}</h2><p>${x[3]}</p><button onclick="toggle(this)">Reveal task →</button><button class="complete ${done?'done':''}" onclick="complete('${x[0]}')">${done?'Practice completed ✓':'Mark practice complete'}</button><div class="challenge">${x[4]}</div></article>`}).join('')}function toggle(b){const x=b.parentElement.querySelector('.challenge');x.classList.toggle('open');b.textContent=x.classList.contains('open')?'Hide task ↑':'Reveal task →'}function complete(n){FSBProgress.set('practice',n,!FSBProgress.stage(n).practice);render()}window.addEventListener('storage',render);render();</script></body></html>
