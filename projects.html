<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>Projects — FullStack Bible</title><script src="progress.js"></script><style>:root{--bg:#f5f5f7;--ink:#111113;--muted:#6e6e73;--blue:#007aff;--purple:#5856d6;--green:#34c759}*{box-sizing:border-box}body{margin:0;background:radial-gradient(60% 35% at 90% 0,#007aff18,transparent 70%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:var(--ink)}.wrap{width:min(920px,calc(100% - 28px));margin:auto}.nav{position:sticky;top:10px;z-index:5;margin-top:10px;padding:9px 10px 9px 17px;border:1px solid #fff;border-radius:20px;background:#ffffffad;backdrop-filter:blur(25px);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.06em;text-decoration:none;color:inherit}.brand span{color:var(--blue)}.back{padding:10px 14px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-size:12px;font-weight:700}.hero{padding:82px 0 30px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#999;font-weight:800}.hero h1{font-size:clamp(48px,8vw,80px);line-height:.94;letter-spacing:-.085em;margin:14px 0}.hero p{color:var(--muted);font-size:17px;line-height:1.65;max-width:720px}.context{display:flex;gap:8px;margin:15px 0}.pill{padding:7px 10px;border-radius:999px;background:#eee9ff;color:var(--purple);font-size:10px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:23px;border:1px solid #fff;border-radius:24px;background:#ffffffb8;box-shadow:0 18px 55px #00000009}.card.feature{grid-column:1/-1;background:linear-gradient(135deg,#ffffffc9,#eef4ffb8)}.level{font-size:10px;font-weight:800;letter-spacing:.13em;color:#888}.card h2{font-size:23px;letter-spacing:-.05em;margin:9px 0}.card p,.card li{font-size:14px;color:#5d5d63;line-height:1.7}.card ul{padding-left:20px}.launch,.complete{display:inline-block;margin-top:8px;padding:10px 14px;border-radius:999px;border:0;background:#111;color:#fff;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}.complete{background:#e9e9ed;color:#666;margin-left:5px}.complete.done{background:var(--green);color:#fff}.footer{text-align:center;color:#999;padding:55px 0 70px;font-size:11px}@media(max-width:650px){.grid{grid-template-columns:1fr}.card.feature{grid-column:auto}.complete{margin-left:0;display:block;margin-top:8px}}</style></head><body><nav class="nav wrap"><a class="brand" href="index.html">FullStack<span>Bible</span></a><a class="back" href="learn.html">Your journey</a></nav><header class="wrap hero"><div class="eyebrow">LEARNING HUB · PROJECTS</div><div class="context" id="context"></div><h1 id="title">Build, don't just read.</h1><p id="intro">Projects turn concepts into engineering ability. Build something you can run, inspect, explain, test and improve.</p></header><main class="wrap grid" id="grid"></main><footer class="wrap footer">Build → test → explain → improve</footer><script>const all=[['01','BEGINNER · MODULE 01','Environment lab','Create a clean project, navigate it with the terminal, inspect a real page with DevTools and repair a deliberate HTML break.','Files · terminal · browser · DevTools'],['02','BEGINNER · MODULE 02','Responsive learner profile','Build a semantic responsive profile with accessible navigation, form controls and keyboard-visible focus.','HTML · CSS · JavaScript · accessibility'],['03','CORE · MODULE 03','Learning dashboard','Build dynamic lessons with events, local persistence, JSON data, fetch, loading and failure states.','DOM · async · storage · APIs'],['04','ENGINEERING · MODULE 04','Team-ready feature','Take a feature from branch to PR, introduce a bug, debug it and add a regression test.','Git · GitHub · debugging · testing'],['05','TYPESCRIPT · MODULE 05','Typed learning state','Model learning state with discriminated unions, typed functions, generics and strict checking.','Types · narrowing · generics · safety'],['06','UI · MODULE 06','React component system','Build LessonCard, ProgressCard, Button and Form with typed props and sound state ownership.','React · state · events · components'],['07','FULL-STACK · MODULE 07','Next.js learning flow','Build a lesson route with server data and a client interaction boundary plus loading/error/not-found states.','Next.js · routing · server/client'],['08','DATA · MODULE 08','Learning data model','Model learners, courses, lessons and enrollments with constraints, relationships, queries and indexes.','SQL · PostgreSQL · modelling'],['09','BACKEND · MODULE 09','Course management API','Build authenticated course and lesson operations with validation, authorization and safe errors.','APIs · auth · authorization · validation'],['10','PRODUCTION · MODULE 10','Ship it safely','Run threat modelling, performance measurement, automated tests, CI, deployment, logging and recovery drills.','Security · performance · testing · operations'],['11','AI · MODULE 11','AI learning coach','Add one useful AI capability with server-side access, structured output, authorization, evaluation and failure handling.','Model APIs · RAG · tools · evaluation'],['12','CAPSTONE · MODULE 12','Learning Hub product','Plan, build, test, launch and improve the complete learning product through vertical slices.','Product · full-stack · launch · iteration'],['13','SYSTEM DESIGN · MODULE 13','10× Learning Hub','Design a scaled architecture with capacity estimates, CDN/cache, queues, workers, database strategy and failure isolation.','Distributed systems · scaling · reliability'],['14','TOOLING · MODULE 14','Engineering monorepo','Create a workspace with shared packages, dependency boundaries, build orchestration and CI quality gates.','Git · workspaces · packages · CI'],['15','BILLING · MODULE 15','Billing state machine','Build a payment/subscription sandbox with idempotent operations, signed webhooks, entitlements and reconciliation.','Payments · webhooks · subscriptions · billing'],['16','DATA · MODULE 16','Production search','Build Learning Hub search with indexing, ranking, filters, pagination, synchronization, replay and rebuild.','MongoDB · search · indexing · relevance'],['17','PROFESSIONAL · MODULE 17','Production readiness system','Create ADR/RFC artifacts, release controls, feature-flag rollout, observability, incident response and recovery runbooks.','Architecture · delivery · SRE · operations']];const q=new URLSearchParams(location.search).get('stage');const selected=q?all.filter(x=>x[0]===q):all;const context=document.getElementById('context');if(q&&selected.length){context.innerHTML='<span class="pill">MODULE '+q+'</span><span class="pill">Focused build</span>';document.getElementById('title').textContent='Build for Module '+q+'.';document.getElementById('intro').textContent='Complete this practical build after the module. Keep scope controlled, make it runnable, testable and explainable.'}function render(){document.getElementById('grid').innerHTML=selected.map(x=>{const done=FSBProgress.stage(x[0]).project;return `<article class="card ${x[0]==='12'?'feature':''}"><div class="level">${x[1]}</div><h2>${x[2]}</h2><p>${x[3]}</p><ul><li><strong>Skills:</strong> ${x[4]}</li><li><strong>Done means:</strong> runnable, explainable and tested.</li></ul>${x[0]==='12'?'<a class="launch" href="module-12.html#capstone">Open capstone brief →</a>':x[0]>='13'?`<a class="launch" href="module-${x[0]}.html#capstone">Open module capstone →</a>`:''}<button class="complete ${done?'done':''}" onclick="complete('${x[0]}')">${done?'Project completed ✓':'Mark project complete'}</button></article>`}).join('')}function complete(n){FSBProgress.set('projects',n,!FSBProgress.stage(n).project);render()}window.addEventListener('storage',render);render();</script></body></html>
